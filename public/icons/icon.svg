<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bee4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bee4-top-loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bee4-bottom-loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bee4-bg)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="4" />
  <!-- Upper figure-8 brain loop (Amber) -->
  <circle cx="256" cy="178" r="68" fill="none" stroke="url(#bee4-top-loop)" stroke-width="34" />
  <circle cx="256" cy="178" r="18" fill="#fbbf24" />
  <!-- Lower figure-8 brain loop (Sky / Ice White) -->
  <circle cx="256" cy="306" r="78" fill="none" stroke="url(#bee4-bottom-loop)" stroke-width="34" />
  <circle cx="256" cy="306" r="20" fill="#38bdf8" />
  <!-- Clean BEE4 wordmark badge -->
  <text x="256" y="446" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="56" letter-spacing="8" fill="#ffffff">BEE4</text>
</svg>

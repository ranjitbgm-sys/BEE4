<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bee4-mask-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bee4-mask-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bee4-mask-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <!-- Full-bleed solid background for Android maskable safe zone -->
  <rect width="512" height="512" fill="url(#bee4-mask-bg)" />
  <!-- Centered logo scaled cleanly inside 70% safe zone (15% padding on all sides) -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)">
    <circle cx="256" cy="186" r="68" fill="none" stroke="url(#bee4-mask-amber)" stroke-width="34" />
    <circle cx="256" cy="186" r="18" fill="#fbbf24" />
    <circle cx="256" cy="314" r="78" fill="none" stroke="url(#bee4-mask-sky)" stroke-width="34" />
    <circle cx="256" cy="314" r="20" fill="#38bdf8" />
  </g>
</svg>

    <!-- Dynamic Origin Resolution for Canonical, OpenGraph, Twitter, and JSON-LD URLs -->
    <script>
      (function () {
        try {
          var origin = window.location.origin;
          var pageUrl = origin + window.location.pathname;
          var imageUrl = origin + '/assets/og-brain-toys.jpg';

          var canonical = document.getElementById('canonical-url');
          if (canonical) canonical.setAttribute('href', pageUrl);

          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) ogUrl.setAttribute('content', pageUrl);

          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg) ogImg.setAttribute('content', imageUrl);

          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg) twImg.setAttribute('content', imageUrl);

          var ld = document.getElementById('bee4-structured-data');
          if (ld && ld.textContent) {
            var parsed = JSON.parse(ld.textContent);
            var nodes = Array.isArray(parsed['@graph']) ? parsed['@graph'] : [parsed];
            nodes.forEach(function (node) {
              if (!node || typeof node !== 'object') return;
              if (typeof node['@id'] === 'string') {
                node['@id'] = node['@id'].replace('https://bee4.in/', pageUrl);
              }
              if (node['@type'] === 'Store') {
                node.url = pageUrl;
                node.image = imageUrl;
              }
              if (node['@type'] === 'BreadcrumbList' && Array.isArray(node.itemListElement)) {
                node.itemListElement.forEach(function (crumb) {
                  if (crumb && typeof crumb.item === 'string') {
                    crumb.item = crumb.item.replace('https://bee4.in/', pageUrl);
                  }
                });
              }
            });
            ld.textContent = JSON.stringify(parsed);
          }
        } catch {}

        try {
          if (localStorage.getItem('bee4_theme_v1') === 'aurora') {
            document.documentElement.classList.add('dark');
          }
        } catch {}
      })();
    </script>
